<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b0111c">
<meta name="format-detection" content="telephone=no">
<title>国庆快乐 ★</title>
<meta name="description" content="祝祖国繁荣昌盛，祝你假期愉快！中华人民共和国成立 77 周年。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d81e2c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;
    background:#7a0b13;
    color:#fff6e0;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 26px);
    position:relative;
  }
  /* 背景：红金放射光 + 柔光晕 */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
      radial-gradient(120% 80% at 50% 30%,#e0212f 0%,#c0131f 38%,#8d0d16 68%,#5d060c 100%)}
  .bg::before{
    content:"";position:absolute;left:50%;top:34%;width:190vmax;height:190vmax;
    transform:translate(-50%,-50%);opacity:.20;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,215,110,.85) 0deg 3deg, rgba(255,215,110,0) 3deg 12deg);
    animation:spin 90s linear infinite;
  }
  .bg::after{
    content:"";position:absolute;inset:-20%;
    background:radial-gradient(46% 34% at 14% 10%,rgba(255,225,150,.26),transparent 70%),
               radial-gradient(40% 30% at 88% 84%,rgba(255,180,90,.18),transparent 72%),
               radial-gradient(78% 52% at 50% 46%,rgba(84,3,9,.50),rgba(84,3,9,.10) 62%,transparent 78%);
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  canvas#fx{position:fixed;inset:0;z-index:1;pointer-events:none}

  .wrap{position:relative;z-index:2;width:100%;max-width:520px;text-align:center}

  .flag{width:74px;height:auto;display:block;margin:0 auto 18px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.38));
    transform-origin:50% 90%;animation:wave 4.2s ease-in-out infinite}
  @keyframes wave{
    0%,100%{transform:rotate(-2.4deg) skewY(1deg)}
    50%{transform:rotate(2.4deg) skewY(-1deg)}
  }

  /* 内容默认可见：即使动画/脚本不执行，也一定看得到祝福语 */
  .kicker{
    display:inline-block;max-width:100%;white-space:nowrap;
    font-size:min(14px,calc((100vw - 76px) / 13.6));letter-spacing:.14em;
    padding:7px 15px;border-radius:999px;
    color:#ffe8b0;background:rgba(0,0,0,.22);
    border:1px solid rgba(255,216,120,.42);
    backdrop-filter:blur(3px);
  }

  h1{
    margin:20px 0 0;
    font-size:min(104px,calc((100vw - 52px) / 4.5));
    line-height:1.06;white-space:nowrap;
    font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#fffdf3 0%,#ffe08a 42%,#ffb92e 78%,#ffdf8f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 rgba(120,20,10,.35)) drop-shadow(0 12px 26px rgba(255,170,40,.42));
    animation:breathe 4.8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.022)}
  }

  .sub{margin:16px 0 0;font-weight:700;color:#ffe6a8;white-space:nowrap;
    font-size:min(19px,calc((100vw - 56px) / 13));letter-spacing:.06em}
  .year{margin:9px 0 0;color:rgba(255,236,190,.72);white-space:nowrap;
    font-size:min(14px,calc((100vw - 56px) / 13.2));letter-spacing:.3em;
    font-variant-numeric:tabular-nums}

  .rule{width:76px;height:2px;margin:26px auto;border-radius:2px;
    background:linear-gradient(90deg,transparent,#ffd87a,transparent)}

  .wish{margin:0;font-size:min(18px,calc((100vw - 52px) / 13.4));line-height:2;color:#fff3d6;
    text-shadow:0 2px 10px rgba(0,0,0,.3)}
  .wish b{color:#ffd75e}

  .hint{margin:34px auto 0;font-size:13px;color:rgba(255,236,190,.66);letter-spacing:.08em}
  .counter{margin:6px auto 0;font-size:12.5px;color:rgba(255,215,120,.85);letter-spacing:.06em;
    font-variant-numeric:tabular-nums}

  .tap{
    margin:26px auto 0;display:inline-block;cursor:pointer;border:0;
    padding:14px 30px;border-radius:999px;font:inherit;font-weight:800;font-size:16px;
    color:#7d1008;background:linear-gradient(180deg,#ffe9a8,#ffc23d);
    box-shadow:0 10px 24px rgba(0,0,0,.32),inset 0 -3px 0 rgba(150,80,0,.28);
    transition:transform .12s ease,box-shadow .12s ease}
  .tap:active{transform:translateY(2px) scale(.98);
    box-shadow:0 5px 14px rgba(0,0,0,.3),inset 0 -2px 0 rgba(150,80,0,.28)}

  .stars5{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .stars5 i{position:absolute;top:-6vh;color:#ffd75e;opacity:.9;
    animation:fall linear infinite;filter:drop-shadow(0 0 6px rgba(255,200,80,.6))}
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0deg);opacity:0}
    10%{opacity:.95}
    100%{transform:translateY(115vh) rotate(320deg);opacity:0}
  }

  footer{position:relative;z-index:2;margin-top:30px;font-size:11.5px;color:rgba(255,236,190,.42);letter-spacing:.1em}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}
  }

  /* 矮屏（如 320x568 的老机型、横屏小窗）自动收紧，尽量一屏放下 */
  @media (max-height:680px){
    body{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
    .flag{width:52px;margin-bottom:10px}
    h1{margin-top:12px}
    .sub{margin-top:10px}
    .year{margin-top:6px}
    .rule{margin:14px auto}
    .wish{line-height:1.75}
    .tap{margin-top:16px;padding:12px 26px;font-size:15px}
    .hint{margin-top:18px}
    footer{margin-top:16px}
  }
  @media (max-height:560px){
    .hint,.counter,footer{display:none}
    .flag{width:44px}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="stars5" id="stars5" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="wrap">
  <svg class="flag" viewBox="0 0 30 20" role="img" aria-label="五星红旗">
    <defs>
      <clipPath id="fl"><rect x="0" y="0" width="30" height="20" rx="2.4"/></clipPath>
      <path id="st" d="M0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309Z"/>
    </defs>
    <g clip-path="url(#fl)">
      <rect width="30" height="20" fill="#de2910"/>
      <g fill="#ffde00">
        <use href="#st" transform="translate(5,5) scale(3)"/>
        <use href="#st" transform="translate(10,2) rotate(23) scale(1)"/>
        <use href="#st" transform="translate(12,4) rotate(46) scale(1)"/>
        <use href="#st" transform="translate(12,7) rotate(70) scale(1)"/>
        <use href="#st" transform="translate(10,9) rotate(20) scale(1)"/>
      </g>
    </g>
  </svg>

  <p class="kicker">不好意思 · 这里没有收款码</p>

  <h1>国庆快乐</h1>

  <p class="sub">中华人民共和国成立 77 周年</p>
  <p class="year">1949 &mdash; 2026 · 10.01</p>

  <div class="rule" aria-hidden="true"></div>

  <p class="wish">
    愿 <b>山河无恙</b>，<b>国泰民安</b><br>
    愿你<b>兜里有钱</b>、<b>心里有光</b><br>
    假期吃好喝好，天天都开心 🎉
  </p>

  <button class="tap" id="tap" type="button">🎆 点我放烟花</button>

  <p class="hint">轻点屏幕任意位置，也能放烟花</p>
  <p class="counter" id="counter">已为你点亮 0 朵烟花</p>

  <footer>祝祖国繁荣昌盛 · 祝朋友万事顺遂 ★</footer>
</main>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 飘落的五角星 ---------- */
  (function fallingStars() {
    var box = document.getElementById('stars5');
    if (!box || reduce) return;
    var n = window.innerWidth < 420 ? 14 : 20;
    for (var i = 0; i < n; i++) {
      var s = document.createElement('i');
      var size = 8 + Math.random() * 16;
      s.textContent = '★';
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.fontSize = size + 'px';
      s.style.animationDuration = (9 + Math.random() * 11) + 's';
      s.style.animationDelay = (-Math.random() * 18) + 's';
      s.style.opacity = (0.28 + Math.random() * 0.5).toFixed(2);
      box.appendChild(s);
    }
  })();

  if (!ctx) return;

  /* ---------- 烟花粒子系统 ---------- */
  var W = 0, H = 0, dpr = 1;
  var rockets = [], sparks = [];
  var COLORS = ['#ffd166', '#ff4d4d', '#fff3c4', '#ffa62b', '#ff7ab6', '#8ce8ff', '#ffffff'];
  var lit = 0, counterEl = document.getElementById('counter');

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 260); });

  function bump() {
    lit++;
    if (counterEl) counterEl.textContent = '已为你点亮 ' + lit + ' 朵烟花';
  }

  function launch(fromX) {
    rockets.push({
      x: fromX == null ? W * (0.18 + Math.random() * 0.64) : fromX,
      y: H + 8,
      vx: (Math.random() - 0.5) * 0.9,
      vy: -(9.2 + Math.random() * 3.4),
      targetY: H * (0.14 + Math.random() * 0.30),
      color: COLORS[(Math.random() * COLORS.length) | 0]
    });
  }

  function burst(x, y, color, power) {
    power = power || 1;
    var count = Math.round((70 + Math.random() * 50) * power);
    var speed = (4.4 + Math.random() * 2.6) * power;
    var ring = Math.random() < 0.45;
    for (var i = 0; i < count; i++) {
      var a = ring ? (i / count) * Math.PI * 2 : Math.random() * Math.PI * 2;
      var sp = ring ? speed * (0.85 + Math.random() * 0.3) : speed * Math.pow(Math.random(), 0.6);
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1, decay: 0.010 + Math.random() * 0.014,
        size: 1.3 + Math.random() * 1.9,
        color: color && Math.random() < 0.72 ? color : COLORS[(Math.random() * COLORS.length) | 0],
        star: Math.random() < 0.3
      });
    }
    bump();
  }

  function star(c, x, y, r, rot) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = (i % 2 === 0) ? r : r * 0.42;
      var ang = rot + i * Math.PI / 5 - Math.PI / 2;
      var px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
  }

  var last = 0;
  function frame(t) {
    var dt = last ? Math.min((t - last) / 16.67, 2.4) : 1;
    last = t;

    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.17)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    var i, p;
    for (i = rockets.length - 1; i >= 0; i--) {
      p = rockets[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.20 * dt;
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.32;
      ctx.beginPath(); ctx.arc(p.x, p.y + 5, 1.5, 0, Math.PI * 2); ctx.fill();
      if (p.y <= p.targetY || p.vy >= -1.1) {
        burst(p.x, p.y, p.color, 1);
        rockets.splice(i, 1);
      }
    }

    for (i = sparks.length - 1; i >= 0; i--) {
      p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.982; p.vy = p.vy * 0.982 + 0.055 * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0.02) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0) * (p.star ? 0.95 : 0.9);
      ctx.fillStyle = p.color;
      if (p.star) {
        star(ctx, p.x, p.y, p.size * (1.5 + p.life), p.life * 6);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + p.life * 0.9), 0, Math.PI * 2); ctx.fill();
      }
    }

    if (sparks.length > 2200) sparks.splice(0, sparks.length - 2200);
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  /* ---------- 交互：点哪儿炸哪儿 ---------- */
  function pointAt(e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: t.clientX, y: t.clientY };
  }
  function onTap(e) {
    var pt = pointAt(e);
    if (pt.x == null) return;
    burst(pt.x, pt.y, null, 1.25);
    if (window.navigator && window.navigator.vibrate) { try { window.navigator.vibrate(18); } catch (err) {} }
  }
  window.addEventListener('touchstart', onTap, { passive: true });
  window.addEventListener('mousedown', function (e) { if (e.button === 0) onTap(e); });
  var btn = document.getElementById('tap');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var r = btn.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      for (var k = 0; k < 3; k++) {
        (function (k) { setTimeout(function () { burst(cx + (k - 1) * 72, r.top - 90 - k * 46, COLORS[k % COLORS.length], 1.35); }, k * 190); })(k);
      }
      if (window.navigator && window.navigator.vibrate) { try { window.navigator.vibrate([20, 40, 20]); } catch (err) {} }
    });
  }

  if (!reduce) {
    requestAnimationFrame(frame);
    // 开场礼花 + 持续助兴
    setTimeout(function () { burst(W * 0.3, H * 0.30, '#ffd166', 1.4); }, 700);
    setTimeout(function () { burst(W * 0.72, H * 0.22, '#ff4d4d', 1.4); }, 1250);
    setTimeout(function () { launch(W * 0.5); }, 1800);
    setInterval(function () { if (!document.hidden) launch(null); }, 2600);
  } else {
    ctx.clearRect(0, 0, W, H);
  }
})();
</script>
</body>
</html>
