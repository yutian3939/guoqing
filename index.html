<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:#f6f6f7;color:#222;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  /* —— 丐版小挂件：还原原版气泡样式，居中摆放 —— */
  #girl-widget{
    position:fixed;left:50%;top:50%;z-index:9999;
    transform:translate(-50%,-50%);
    width:clamp(240px,50vmin,620px);
    aspect-ratio:1026/860;   /* 气泡在上、人物在右下，互不遮挡 */
    user-select:none;
  }
  /* 气泡：常驻显示，整体放在左上，宽度 88%（SVG 自带 1026×700 比例） */
  #girl-bubble{
    position:absolute;left:0;top:0;width:88%;
    aspect-ratio:1026/700;height:auto;
    z-index:2;overflow:visible;pointer-events:none;
  }
  /* 人物：右下角，压在气泡下方（层级更低） */
  #girl-widget .girl{
    position:absolute;right:0;bottom:0;width:36%;
    z-index:1;cursor:pointer;-webkit-user-drag:none;
    -webkit-tap-highlight-color:transparent;
    transform-origin:50% 100%;   /* 以底边中心为轴，按压时底部不动 */
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  #girl-widget .girl:active{ /* 按压 Q 弹 */
    transform:scaleY(.88) scaleX(1.05);
  }
  #girl-widget .girl img{display:block;width:100%;pointer-events:none}
  /* 气泡内文字：字号按 SVG viewBox 单位（1026×700）自动缩放 */
  #girl-bubble .btext{
    height:100%;display:flex;align-items:center;justify-content:center;
    text-align:center;color:#536ba9;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:58px;font-weight:600;line-height:1.3;
    padding:0 24px;white-space:pre-wrap;overflow-wrap:anywhere;
    pointer-events:auto;   /* 让台词里的“点这里”可点（气泡其余部分仍穿透） */
  }
  #girl-bubble .btext .bl{display:block}
  #girl-bubble .btext .hint{
    display:block;margin-top:12px;
    font-size:52px;font-weight:400;color:#9fb0d9;
  }
  /* 台词里的可点文字（气泡默认不吃事件，这里单独放开） */
  #girl-bubble .btext .pay{
    pointer-events:auto;cursor:pointer;
    color:#203170;font-weight:800;
    text-decoration:underline;text-underline-offset:6px;
  }
  /* 收款码弹层 */
  #pay-mask{
    position:fixed;inset:0;z-index:10000;
    display:flex;align-items:center;justify-content:center;
    background:rgba(16,24,48,.55);
    opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s;
    cursor:zoom-out;
  }
  #pay-mask.show{opacity:1;visibility:visible}
  #pay-mask img{
    max-width:82vw;max-height:82vh;border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    transform:scale(.9);transition:transform .24s cubic-bezier(.34,1.56,.64,1);
  }
  #pay-mask.show img{transform:scale(1)}
</style>
</head>
<body>

  <!-- 在这里写你的内容 -->

  <!-- 常驻气泡小挂件（SVG 气泡几何还原原版） -->
  <div id="girl-widget">
    <!-- 气泡：viewBox 0 0 1026 700，大椭圆(454,247)rx373ry232 + 两个小泡 -->
    <svg id="girl-bubble" viewBox="0 0 1026 700" aria-hidden="true">
      <ellipse cx="454" cy="247" rx="373" ry="232"
               fill="#fff" stroke="#203170" stroke-width="18" stroke-linejoin="round"/>
      <ellipse cx="352" cy="561" rx="37.5" ry="26"
               fill="#fff" stroke="#203170" stroke-width="18"/>
      <ellipse cx="442" cy="646" rx="24.5" ry="18"
               fill="#fff" stroke="#203170" stroke-width="18"/>
      <!-- 文字区：椭圆 bbox 内，居中；内容由下面的脚本控制 -->
      <foreignObject x="90" y="40" width="728" height="414">
        <div xmlns="http://www.w3.org/1999/xhtml" class="btext" id="girl-text"><span class="bl">这里没有什么收款码<br>只有国庆快乐！🎉</span></div>
      </foreignObject>
    </svg>
    <div class="girl">
      <img src="好女孩.png" alt="好女孩">
    </div>
  </div>

  <!-- 收款码弹层（点台词里的“点这里”打开，点任意处/ESC 关闭） -->
  <div id="pay-mask">
    <img src="收款码.png" alt="收款码">
  </div>

<script>
(function () {
  var girl = document.querySelector('#girl-widget .girl');
  var text = document.getElementById('girl-text');
  var mask = document.getElementById('pay-mask');

  // 台词池：第 1 条 = 打开页面默认显示；带 <span class="pay"> 的那条会弹出收款码
  var LINES = [
    '这里没有什么收款码<br>只有国庆快乐！🎉',
    '好女孩... ↓',
    '今天也要加油鸭～',
    '压力一只蓝色大肥鱼',
    '我去吃饭啦～',
    '哦鲸鲸... ',
    '什么？你不会真想给钱吧<br><span class="pay">那点这里</span>'
  ];
  var idx = 0;   // 当前台词下标，0 就是默认那条

  // 台词始终包在一个 .bl 里 —— 否则 <br> 会被 flex 拆成并排的两项
  function setLine(i) {
    idx = i;
    text.innerHTML = '<span class="bl">' + LINES[i] + '</span>';
  }

  // 点人物：随机换一条（不重复当前这条）
  girl.addEventListener('click', function () {
    var n;
    do { n = Math.floor(Math.random() * LINES.length); }
    while (n === idx && LINES.length > 1);
    setLine(n);
  });

  setLine(0);   // 打开时显示默认那条

  // 台词里的“点这里”→ 弹收款码
  text.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('pay')) openPay();
  });

  function openPay() { mask.classList.add('show'); }
  function closePay() { mask.classList.remove('show'); }

  mask.addEventListener('click', closePay);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePay();
  });
})();
</script>

</body>
</html>
